name: Verificar edição

# Confere, a cada push, se todos os JSON de edição são válidos,
# se a edição mais recente monta sem erro e se o HTML publicado (capa, edição
# e arquivo de edições) bate com ela.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: JSON válidos
        run: for f in registro.json edicoes/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Montar a edição mais recente
        run: python3 build.py
      - name: HTML publicado está atualizado
        run: |
          # mesma ordem do build.py: 2026-09-30-noite vem depois de 2026-09-30
          ultima=$(python3 -c "import glob, os; print(max(os.path.basename(f)[:-5] for f in glob.glob('edicoes/*.json')))")
          git diff --exit-code -- index.html edicoes/index.html "edicoes/${ultima}.html"
